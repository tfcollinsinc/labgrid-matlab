name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the live coordinator/board tests"
        type: boolean
        default: false

jobs:
  unit:
    name: Unit tests (no hardware)
    # Board-free tests use the public-project MathWorks license on GitHub-hosted CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b
          cache: true
      - name: buildtool test
        uses: matlab-actions/run-build@v2
        with:
          tasks: test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: tests/tmp/unit-results.xml
          if-no-files-found: error

  live:
    name: Live coordinator + board tests
    if: github.event_name == 'workflow_dispatch' && inputs.live
    needs: unit
    runs-on: [self-hosted, hw-nemo]
    env:
      MATLAB_BIN: ${{ vars.MATLAB_BIN || '/mnt/onetb/MATLAB/R2025b/bin/matlab' }}
      LG_COORDINATOR: ${{ vars.LG_COORDINATOR }}
      LG_TEST_PART: ${{ vars.LG_TEST_PART || 'adrv9009' }}
    steps:
      - uses: actions/checkout@v4
      - name: buildtool testLive
        run: |
          set -euo pipefail
          "$MATLAB_BIN" -batch "buildtool testLive"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-results
          path: tests/tmp/live-results.xml
